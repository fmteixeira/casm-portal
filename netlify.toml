[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # react-router needs Node >= 22.22; matches local development.
  NODE_VERSION = "24"

# Single-page app: serve index.html for every route (/sobre, /galeria/..., etc.).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Built assets have content hashes in their names, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
